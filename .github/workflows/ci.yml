# Security posture (see CONTRIBUTING.md "CI security"):
# - All actions pinned by commit SHA; Renovate keeps the pins current.
# - Bazel caches are used ONLY in test jobs. The artifact job builds cold —
#   a poisoned cache must never be able to reach a deployable binary.
# - checkout never persists credentials; permissions are read-only.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# Superseded runs are dead weight — a new push cancels the old run's
# (10x-billed) macOS minutes. Release workflows serialize instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # checkout only

jobs:
  # Linux covers format, lint (nogo rides compilation), and all pure-Go
  # build/test fast. Cached: test feedback only, no artifacts.
  linux:
    name: build + test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          lfs: true # internal/vhdx/testdata's binary fixtures are LFS-tracked
      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', '.mise.toml') }}
          restore-keys: bazel-${{ runner.os }}-
      # rules_apple resolves the Apple toolchain during analysis, which
      # hard-fails on Linux before incompatible-target skipping can apply — so
      # target_compatible_with can't prune the macOS app from a //... build
      # here (bazel#12897). Exclude it explicitly; the macOS job builds it.
      - name: build
        run: mise x -- bazel build --config=ci -- //... -//apps/Runny/...
      - name: test
        run: mise x -- bazel test --config=ci -- //... -//apps/Runny/...
      # Windows hosts are a runner target (Hyper-V-backed guests): keep the
      # daemon and CLI cross-compiling for windows/amd64. This also covers the
      # in-graph proto package a plain `GOOS=windows go build` can't resolve.
      # internal/winhcs is windows-only and otherwise dead (nothing imports
      # it yet -- the VM backend PR, #308, is the first consumer), so without
      # this it silently goes unbuilt. The two go_test targets are excluded:
      # cross-compiling a windows go_test needs a windows test-execution
      # toolchain this runner doesn't have, even just to build the binary.
      - name: cross-build (windows/amd64)
        run: mise x -- bazel build --config=ci --platforms=@rules_go//go/toolchain:windows_amd64 -- //cmd/runnyd //cmd/runnyctl //internal/winhcs/... -//internal/winhcs/log:log_test -//internal/winhcs/oc:oc_test
      - name: format
        run: |
          mise x -- bazel run --config=ci //tools/format
          git diff --exit-code

  # Darwin-only targets (vz cgo) build/test here. Cached: test feedback
  # only. GitHub's macOS runners are themselves VMs (no nested
  # virtualization), so CI never boots guests — that remains an ix job.
  macos:
    name: build + test (macos)
    # macos-26 matches the deployment host (ix) and guest image generation.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          lfs: true # internal/vhdx/testdata's binary fixtures are LFS-tracked
      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/bazel
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', '.mise.toml') }}
          restore-keys: bazel-${{ runner.os }}-
      - name: build
        run: mise x -- bazel build --config=ci //...
      - name: test
        run: mise x -- bazel test --config=ci //...

  # Runner hosts are a Windows target too; the linux job's cross-build step
  # only proves the tree compiles for windows/amd64 — this job actually
  # EXECUTES the test suite on a real Windows host. mise (not bazelisk)
  # acquires bazel: the aqua backend supports windows/amd64 for our pinned
  # 9.1.1, so this is one toolchain source (.mise.toml) across every job
  # rather than a second pinning mechanism for one platform. Excluded:
  # internal/sysdaemon (macOS LaunchDaemon-only — launchctl/dscl — with no
  # Windows SCM equivalent yet; its tests assert literal unix paths against a
  # feature that plainly can't run here).
  windows:
    name: build + test (windows)
    runs-on: windows-2022
    steps:
      # Must run before checkout: mangled line endings in checked-out fixtures
      # are a one-way trip, not something to fix up after.
      - name: disable line-ending mangling
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          lfs: true # internal/vhdx/testdata's binary fixtures are LFS-tracked
      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:/b
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', '.mise.toml') }}
          restore-keys: bazel-${{ runner.os }}-
      # --output_base pins a short, fixed output tree: bazel's default
      # per-workspace-hash path under %USERPROFILE% nests deep enough to hit
      # MAX_PATH, and a fixed path is what makes the cache above reusable
      # (same whole-output-root strategy as the linux/macos jobs, not
      # --disk_cache). Forward slashes, not C:\b: these run steps are bash
      # (Git Bash), which strips the backslash from an unquoted \b before
      # bazel ever sees it — Bazel accepts forward-slash paths on Windows
      # natively, so this sidesteps the escaping problem entirely.
      - name: build
        shell: bash
        run: mise x -- bazel --output_base=C:/b build --config=ci -- //... -//apps/Runny/... -//internal/sysdaemon:sysdaemon_test
      # Bazel's local test sandbox doesn't pass USERPROFILE through by
      # default on windows (unlike HOME on unix) — os.UserHomeDir needs it.
      - name: test
        shell: bash
        run: mise x -- bazel --output_base=C:/b test --config=ci --test_env=USERPROFILE -- //... -//apps/Runny/... -//internal/sysdaemon:sysdaemon_test

  # The race detector, on its own job because the instrumented rebuild runs
  # ~2-10x slower than the default test path (.bazelrc test:race). macOS so
  # the cgo/vz packages are race-tested too, not just pure-Go — the FSM's
  # goroutine-per-slot design and the oci errgroup are exactly the
  # unsynchronized-shared-state surface this catches (it would have caught the
  # OperatorKeys race before review). The Swift app is excluded: the race flag
  # is Go-only (--@rules_go//go/config:race), so building it here is wasted
  # work the macos job already does. A distinct cache key keeps the
  # race-instrumented objects from thrashing the non-race macOS cache.
  race:
    name: build + test (race)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          lfs: true # internal/vhdx/testdata's binary fixtures are LFS-tracked
      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/bazel
          key: bazel-${{ runner.os }}-race-${{ hashFiles('MODULE.bazel', '.mise.toml') }}
          restore-keys: bazel-${{ runner.os }}-race-
      - name: test (race)
        run: mise x -- bazel test --config=ci --config=race -- //... -//apps/Runny/...

  # Combined Go+Swift lcov report, uploaded to Codecov for visibility only —
  # codecov.yml turns off the project/patch status checks, so a coverage
  # drop never fails a PR. macOS so the Swift side is included; the
  # coverage config's --linkopt=--coverage (.bazelrc) is what makes that
  # link succeed at all.
  coverage:
    name: coverage (informational)
    runs-on: macos-26
    # Dedicated environment (no branch restriction — this runs on every PR,
    # not just main) so CODECOV_TOKEN is scoped like every other secret here.
    environment: coverage
    permissions:
      contents: read # checkout only
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          lfs: true # internal/vhdx/testdata's binary fixtures are LFS-tracked
      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/bazel
          key: bazel-${{ runner.os }}-coverage-${{ hashFiles('MODULE.bazel', '.mise.toml') }}
          restore-keys: bazel-${{ runner.os }}-coverage-
      - name: coverage
        run: mise x -- bazel coverage --config=ci --combined_report=lcov -- //...
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: bazel-out/_coverage/_coverage_report.dat
          fail_ci_if_error: false

  # The workflows themselves are attack surface (template injection,
  # unpinned actions, excessive permissions, leaked App tokens): zizmor
  # audits them. The pre-commit hook runs the same audit --offline via the
  # mise-pinned CLI; this job runs the official action with online checks.
  zizmor:
    name: workflow audit
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only
      security-events: write # SARIF upload to code scanning
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@6599ee8b7a49aef6a770f63d261d214911a7ce02 # v0.6.0
        id: zizmor
        with:
          # Strictest persona: catches secrets-outside-env and friends.
          persona: auditor
      # Advanced Security mode (the action's default) uploads SARIF to code
      # scanning but never fails the job; this step is the gate. A
      # Security-tab dismissal does not unblock it — suppressions are
      # inline `# zizmor: ignore[rule]` comments, per CONTRIBUTING.
      - name: fail on findings
        env:
          SARIF: ${{ steps.zizmor.outputs.output-file }}
        run: |
          count=$(jq '[.runs[].results[]] | length' "$SARIF")
          [ "$count" -eq 0 ] || { echo "::error::zizmor reported $count finding(s)"; exit 1; }

  # Deployable binaries build COLD — no Bazel or tool caches, exact-pinned
  # toolchain — so cache poisoning cannot reach an artifact. Every build is
  # stamped (ADR-0010): branch/PR builds carry the conventional-commit
  # implied next version with a -beta.<sha> suffix; release builds (tag) the
  # clean version. Provenance is attested either way.
  artifact:
    name: cold artifact build
    runs-on: macos-26
    permissions:
      contents: read # checkout only
      id-token: write # OIDC identity for provenance attestation
      attestations: write # attest-build-provenance stores the attestation
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0 # tools/version.sh needs tags + history
      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          # No tool-install cache either: cold means cold. Tools come from
          # their pinned upstream releases, not a poisonable cache entry.
          cache: false
      - name: build (cold, stamped, ad-hoc signed)
        # codesign_binary defaults to ad-hoc ('-') when CODESIGN_IDENTITY is
        # unset; Developer ID signing requires cert secrets on the release
        # environment (see CONTRIBUTING.md "Codesigning tiers"). The app dmg
        # additionally needs --embed_label so apple_bundle_version stamps
        # CFBundleShortVersionString/CFBundleVersion. Bundle version fields
        # are numeric-only, so the bundle carries the bare x.y.z; the full
        # pre-release label (x.y.z-beta.<sha>) rides the artifact filename
        # and the Go binaries' stamps (ADR-0010 identifiability, within
        # Apple's constraint).
        run: |
          VERSION="$(mise x -- tools/version.sh)"
          echo "runny version: $VERSION"
          mise x -- bazel build --config=ci --config=release \
            --embed_label="$VERSION" \
            //cmd/runnyd:runnyd_signed //cmd/runnyctl:runnyctl_signed \
            //apps/Runny:Runny_dmg
          cp bazel-bin/cmd/runnyd/runnyd_signed.bin runnyd
          cp bazel-bin/cmd/runnyctl/runnyctl_signed.bin runnyctl
          cp bazel-bin/apps/Runny/Runny_dmg.dmg Runny.dmg
          ./runnyctl version
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        if: github.event_name == 'push'
        with:
          subject-path: |
            runnyd
            runnyctl
            Runny.dmg
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runny-darwin-arm64
          path: |
            runnyd
            runnyctl
            Runny.dmg
