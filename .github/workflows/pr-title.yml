# On squash-merge the PR title becomes the commit subject on main — commitlint
# never sees it, so it gets the same grammar gate here.
name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# A re-edit of the title supersedes the previous validation run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: read # the action reads the PR title

jobs:
  validate:
    name: validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            ci
            build
            chore
            revert
            style
          subjectPattern: ^[a-z].*$
