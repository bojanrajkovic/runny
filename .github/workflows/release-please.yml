# release-please owns versions, CHANGELOG, tags, and GitHub releases
# (ADR-0010). Artifacts attach via release.yml when the release publishes.
# It runs with an App token, not GITHUB_TOKEN: GitHub suppresses workflow
# triggers for GITHUB_TOKEN-created events, so a GITHUB_TOKEN-published
# release would never fire release.yml (and release PRs would get no CI).
name: release-please

on:
  push:
    branches: [main]

# Serialize: never cancel an in-flight run mid-release; the next push
# queues behind it.
concurrency:
  group: release-please
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: version + release PR
    runs-on: ubuntu-latest
    # The App private key lives on the releaser-app environment — the trust
    # domain for minting App tokens, separate from `release` (which holds
    # signing credentials). Only jobs declaring this environment can read it.
    environment: releaser-app
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          app-id: ${{ vars.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
          # Release PRs + version commits/tags/releases — without these the
          # token inherits every permission the App installation has.
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}
