# release-please owns versions, CHANGELOG, tags, and GitHub releases
# (ADR-0010). Artifacts attach via release.yml when the release publishes.
# Known caveat: GITHUB_TOKEN-created PRs don't trigger CI on themselves.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
