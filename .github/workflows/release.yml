# Release artifacts (ADR-0010): cold stamped Bazel build (no caches — see
# CONTRIBUTING.md "CI security"), signed and notarized in-graph by the
# runnyd_notarized target, checksummed, attested, and attached to the
# release; then the Homebrew tap formula is updated when the releaser App
# is configured. The formula's sha256 comes from the package step's own
# checksum via job outputs — never from re-downloading the asset (a
# CDN-propagation race, and it would attest whatever GitHub served rather
# than what this run built).
#
# Signing and notarization are Bazel genrule targets (tools/sign/sign.bzl):
#   codesign_binary  → //cmd/runnyd:runnyd_signed  (Developer ID + hardened runtime + timestamp)
#   notarize_binary  → //cmd/runnyd:runnyd_notarized (notarytool submit --wait; output identical to input)
#   codesign_app/notarize_app/app_dmg/notarize_dmg
#                    → //apps/Runny:Runny_notarized_dmg (signed, notarized, stapled app in a stapled dmg)
#
# When BUILD_CERTIFICATE_BASE64 is absent the build falls back to ad-hoc
# signing and skips notarization — both graceful-skip paths live in the
# Bazel targets, not in workflow conditionals.
name: release

on:
  release:
    types: [published]

# One release at a time, never cancelled mid-publish; a second publish
# event queues behind the first.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  artifacts:
    name: build + attest artifacts
    runs-on: macos-26
    # Signing/notary credentials (Developer ID, when configured) live on
    # this environment, restricted to v* tag refs; jobs outside it cannot
    # read them.
    environment: release
    permissions:
      contents: write # attach assets to the release
      id-token: write # OIDC identity for provenance attestation
      attestations: write # attest-build-provenance stores the attestation
    # The `secrets` context is NOT available in step `if:` conditions — using
    # it there is a workflow validation error that fails the file's startup on
    # every push. Map secret PRESENCE to job-level env (where secrets ARE
    # allowed) once, and gate the optional signing/notary steps on env, which
    # `if:` can read. The secret VALUES are still only read where used.
    env:
      HAS_SIGNING_CERT: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' }}
      HAS_NOTARY_KEY: ${{ secrets.NOTARY_KEY_P8 != '' }}
    outputs:
      version: ${{ steps.package.outputs.version }}
      sha256: ${{ steps.package.outputs.sha256 }}
      dmg_sha256: ${{ steps.package.outputs.dmg_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # tools/version.sh needs tags
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          cache: false
      # dotnet pack (below) takes a bare .nuspec directly as of .NET 10 — no
      # placeholder .csproj needed. Pinned independently of mise since it's
      # the one non-Bazel, non-mise tool this job needs.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      # Import the Developer ID cert into a short-lived keychain. Skipped
      # (and the keychain cleanup step no-ops) when the secret is absent.
      # The identity string is extracted from the keychain after import so
      # the workflow never hardcodes a specific cert CN.
      - name: import signing certificate
        id: import-cert
        if: ${{ env.HAS_SIGNING_CERT == 'true' }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" \
            -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          # Allow codesign to use the key without interactive prompts.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | awk -F'"' '/Developer ID Application/{print $2; exit}')
          echo "codesign_identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      # Decode notary credentials into job env vars so --config=notarize can
      # pick them up via --action_env (no value → inherit from environment).
      # Skipped when the secret is absent; the notarize_binary genrule then
      # sees an empty NOTARY_KEY_B64 and copies the binary unchanged.
      - name: set notarization credentials
        if: ${{ env.HAS_NOTARY_KEY == 'true' }}
        run: |
          echo "NOTARY_KEY_B64=$(printf '%s' "$NOTARY_KEY_P8" | base64 | tr -d '\n')" >> "$GITHUB_ENV"
          echo "NOTARY_KEY_ID=$NOTARY_KEY_ID_VAL" >> "$GITHUB_ENV"
          echo "NOTARY_ISSUER_ID=$NOTARY_ISSUER_ID_VAL" >> "$GITHUB_ENV"
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID_VAL: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID_VAL: ${{ secrets.NOTARY_ISSUER_ID }}

      - name: build (cold, stamped, signed, notarized)
        env:
          # Developer ID when the cert is present; '-' (ad-hoc) otherwise.
          # The identity is read from the keychain after import — never hardcoded.
          CODESIGN_IDENTITY: ${{ steps.import-cert.outputs.codesign_identity || '-' }}
        # --embed_label feeds apple_bundle_version so the app's
        # CFBundleShortVersionString/CFBundleVersion match the release tag.
        run: |
          VERSION="$(mise x -- tools/version.sh)"
          mise x -- bazel build --config=ci --config=release \
            --action_env="CODESIGN_IDENTITY=$CODESIGN_IDENTITY" \
            --config=notarize \
            --embed_label="$VERSION" \
            //cmd/runnyd:runnyd_notarized //cmd/runnyctl:runnyctl_notarized \
            //apps/Runny:Runny_notarized_dmg

      # Remove the temp keychain whether the build succeeded or failed.
      - name: remove signing keychain
        if: ${{ always() && steps.import-cert.outcome != 'skipped' }}
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db"

      - name: package
        id: package
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(mise x -- tools/version.sh)"
          # The tag must be exactly what version.sh stamps at this commit —
          # a hand-named tag is how svu and release-please diverge (ADR-0010).
          [ "v$VERSION" = "$TAG" ] || { echo "tag $TAG != stamped v$VERSION" >&2; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          cp bazel-bin/cmd/runnyd/runnyd_notarized.bin dist/runnyd
          cp bazel-bin/cmd/runnyctl/runnyctl_notarized.bin dist/runnyctl
          tar -C dist -czf "runny_${VERSION}_darwin_arm64.tar.gz" runnyd runnyctl
          shasum -a 256 "runny_${VERSION}_darwin_arm64.tar.gz" > "runny_${VERSION}_darwin_arm64.tar.gz.sha256"
          echo "sha256=$(cut -d' ' -f1 < "runny_${VERSION}_darwin_arm64.tar.gz.sha256")" >> "$GITHUB_OUTPUT"
          cp bazel-bin/apps/Runny/Runny_notarized_dmg.dmg "Runny_${VERSION}.dmg"
          shasum -a 256 "Runny_${VERSION}.dmg" > "Runny_${VERSION}.dmg.sha256"
          echo "dmg_sha256=$(cut -d' ' -f1 < "Runny_${VERSION}.dmg.sha256")" >> "$GITHUB_OUTPUT"

      # Windows hosts are a runner target too (ADR-0026), and runnyd/runnyctl
      # already cross-compile clean for both windows/amd64 and windows/arm64 —
      # CI proves it (ci.yml's linux job). No signing applies off Darwin
      # (codesign_binary/notarize_binary are target_compatible_with macos
      # only), so these are the bare stamped_go_binary outputs, zipped like
      # the darwin tarball. Each `bazel build --platforms=...` call moves
      # bazel-bin's convenience symlink to that invocation's own output tree,
      # so every exe is copied out immediately after its own build — never
      # after a later --platforms call has pointed the symlink elsewhere.
      - name: cross-build + package (windows)
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          for arch in amd64 arm64; do
            mise x -- bazel build --config=ci --config=release \
              --platforms="@rules_go//go/toolchain:windows_$arch" \
              -- //cmd/runnyd //cmd/runnyctl
            mkdir -p "dist-windows-$arch"
            cp "bazel-bin/cmd/runnyd/runnyd_/runnyd.exe" "dist-windows-$arch/runnyd.exe"
            cp "bazel-bin/cmd/runnyctl/runnyctl_/runnyctl.exe" "dist-windows-$arch/runnyctl.exe"
            (cd "dist-windows-$arch" && zip "../runny_${VERSION}_windows_${arch}.zip" runnyd.exe runnyctl.exe)
            shasum -a 256 "runny_${VERSION}_windows_${arch}.zip" > "runny_${VERSION}_windows_${arch}.zip.sha256"
          done

      # Chocolatey, release-asset-only for now (ADR-0010 amendment): no
      # self-hosted feed yet, so there's no `choco source add` — users
      # `choco install <downloaded-path>`. Built from the windows/amd64 exes
      # staged above; Chocolatey has no meaningful arm64 story to target yet.
      - name: package (chocolatey)
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          mkdir -p choco/tools
          cp dist-windows-amd64/runnyd.exe dist-windows-amd64/runnyctl.exe choco/tools/
          # Hooks ship verbatim (no envsubst): they carry no version, and a
          # stray $var in PowerShell must not be substituted away.
          cp tools/deploy/chocolateyBeforeModify.ps1 tools/deploy/chocolateyInstall.ps1 choco/tools/
          RUNNYD_SHA256=$(shasum -a 256 choco/tools/runnyd.exe | cut -d' ' -f1)
          RUNNYCTL_SHA256=$(shasum -a 256 choco/tools/runnyctl.exe | cut -d' ' -f1)
          export VERSION RUNNYD_SHA256 RUNNYCTL_SHA256
          envsubst '${VERSION} ${RUNNYD_SHA256} ${RUNNYCTL_SHA256}' \
            < tools/deploy/runny.nuspec.tmpl > choco/runny.nuspec
          envsubst '${VERSION} ${RUNNYD_SHA256} ${RUNNYCTL_SHA256}' \
            < tools/deploy/VERIFICATION.txt.tmpl > choco/tools/VERIFICATION.txt
          dotnet pack choco/runny.nuspec -o .
          shasum -a 256 "runny.${VERSION}.nupkg" > "runny.${VERSION}.nupkg.sha256"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            runny_*.tar.gz
            runny_*.zip
            runny.*.nupkg
            Runny_*.dmg
      - name: attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" runny_*.tar.gz runny_*.sha256 runny_*.zip runny.*.nupkg runny.*.nupkg.sha256 Runny_*.dmg Runny_*.dmg.sha256

  homebrew:
    name: update tap formula
    needs: artifacts
    runs-on: ubuntu-latest
    # The App private key is on releaser-app (see release-please.yml) —
    # this job mints App tokens but must not see signing credentials.
    environment: releaser-app
    # contents:read is only to check out this repo's formula template; the tap
    # push uses a GitHub App installation token scoped to homebrew-tap, never
    # GITHUB_TOKEN (which has no cross-repo write anyway).
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: mint tap token
        id: tap-token
        # The release bot App; its id is a public var, its key a secret. Absent
        # until configured, which makes the whole tap update a graceful no-op.
        if: ${{ vars.RELEASER_APP_ID != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
          owner: bojanrajkovic
          repositories: homebrew-tap
          # tap repo contents write (formula + cask) — without this the token
          # inherits every permission the App installation has.
          permission-contents: write
      - name: update tap formula
        if: ${{ steps.tap-token.outputs.token != '' }}
        env:
          TAP_TOKEN: ${{ steps.tap-token.outputs.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.artifacts.outputs.version }}
          SHA: ${{ needs.artifacts.outputs.sha256 }}
          DMG_SHA: ${{ needs.artifacts.outputs.dmg_sha256 }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          export URL="https://github.com/${REPO}/releases/download/${TAG}/runny_${VERSION}_darwin_arm64.tar.gz"
          export DMG_URL="https://github.com/${REPO}/releases/download/${TAG}/Runny_${VERSION}.dmg"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/bojanrajkovic/homebrew-tap.git" tap
          mkdir -p tap/Formula tap/Casks

          # A GitHub pre-release (manual beta tag, ADR-0010) renders the
          # opt-in beta formula/cask instead of the default pair, so
          # publishing a beta never clobbers what `brew install runny`
          # resolves to.
          if [ "$PRERELEASE" = "true" ]; then
            FORMULA_TMPL=tools/deploy/runny-beta.rb.tmpl
            FORMULA_REL=Formula/runny-beta.rb
            CASK_TMPL=tools/deploy/runny-app-beta.rb.tmpl
            CASK_REL=Casks/runny-app-beta.rb
          else
            FORMULA_TMPL=tools/deploy/runny.rb.tmpl
            FORMULA_REL=Formula/runny.rb
            CASK_TMPL=tools/deploy/runny-app.rb.tmpl
            CASK_REL=Casks/runny-app.rb
          fi

          # Render the reviewed templates; only the listed vars are substituted per template
          # so Ruby's own #{...} interpolations pass through untouched.
          envsubst '${VERSION} ${URL} ${SHA}' < "$FORMULA_TMPL" > "tap/$FORMULA_REL"
          envsubst '${VERSION} ${DMG_URL} ${DMG_SHA}' < "$CASK_TMPL" > "tap/$CASK_REL"
          cd tap
          git add "$FORMULA_REL" "$CASK_REL"
          git -c user.name="runny-release[bot]" -c user.email="noreply@coderinserepeat.com" \
            commit -m "runny ${VERSION}"
          # Explicit target: cloning an empty tap can leave the local branch
          # named 'master', and brew reads the formula from the default branch
          # (main). HEAD:main pushes there regardless of the local name.
          git push origin HEAD:main

  chocolatey-feed:
    name: publish to the chocolatey feed
    needs: artifacts
    runs-on: ubuntu-latest
    # Same App as the tap (see release-please.yml): this job mints an
    # installation token and must not see signing credentials.
    environment: releaser-app
    # contents:read is for reading this release's own .nupkg back via gh; the
    # feed push uses an installation token scoped to choco-feed, never
    # GITHUB_TOKEN (which has no cross-repo write anyway).
    permissions:
      contents: read
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - name: mint feed token
        id: feed-token
        # Absent until the App is configured, which makes the whole feed
        # publish a graceful no-op — same shape as the tap update above.
        if: ${{ vars.RELEASER_APP_ID != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
          owner: bojanrajkovic
          repositories: choco-feed
          permission-contents: write
      - name: push to the feed
        if: ${{ steps.feed-token.outputs.token != '' }}
        env:
          FEED_TOKEN: ${{ steps.feed-token.outputs.token }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.artifacts.outputs.version }}
        run: |
          set -euo pipefail
          # Read the .nupkg back off the release rather than rebuilding it, so
          # the feed serves the exact attested bytes this release published.
          gh release download "$TAG" --repo "$REPO" --pattern 'runny.*.nupkg' --dir pkg
          dotnet tool install -g sleet
          export PATH="$PATH:$HOME/.dotnet/tools"

          git clone "https://x-access-token:${FEED_TOKEN}@github.com/bojanrajkovic/choco-feed.git" feed
          cd feed
          # sleet.json lives in the feed repo and uses a RELATIVE path, so sleet
          # has to run from the clone. Its baseURI is absolute and is baked into
          # every generated file — changing the Pages URL means regenerating the
          # whole feed, not editing a config.
          #
          # --force makes re-running a release idempotent instead of failing on
          # an already-present version.
          sleet push ../pkg/runny.*.nupkg --config ./sleet.json --source runny --force

          # No beta/stable split here, unlike the Homebrew tap: one NuGet feed
          # holds every version, and Chocolatey only surfaces pre-releases when
          # asked (`choco install runny --pre`). So a beta tag publishes
          # alongside the stable versions without clobbering what a plain
          # `choco install runny` resolves to, and needs no separate channel.
          git add -A
          git -c user.name="runny-release[bot]" -c user.email="noreply@coderinserepeat.com" \
            commit -m "runny ${VERSION}"
          git push origin HEAD:main
