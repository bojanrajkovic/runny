# Release artifacts (ADR-0010): cold stamped Bazel build (no caches — see
# CONTRIBUTING.md "CI security"), ad-hoc signed, checksummed, attested, and
# attached to the release; then the Homebrew tap formula is updated when a
# TAP_PUSH_TOKEN secret exists. The formula's sha256 comes from the package
# step's own checksum via job outputs — never from re-downloading the asset
# (a CDN-propagation race, and it would attest whatever GitHub served
# rather than what this run built).
name: release

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  artifacts:
    runs-on: macos-26
    outputs:
      version: ${{ steps.package.outputs.version }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0 # tools/version.sh needs tags
      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4
        with:
          cache: false
      - name: build (cold, stamped)
        run: mise x -- bazel build --config=ci --config=release //cmd/runnyd //cmd/runnyctl
      - name: package
        id: package
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(mise x -- tools/version.sh)"
          # The tag must be exactly what version.sh stamps at this commit —
          # a hand-named tag is how svu and release-please diverge (ADR-0010).
          [ "v$VERSION" = "$TAG" ] || { echo "tag $TAG != stamped v$VERSION" >&2; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          cp bazel-bin/cmd/runnyd/runnyd_/runnyd dist/
          cp bazel-bin/cmd/runnyctl/runnyctl_/runnyctl dist/
          chmod +w dist/runnyd
          codesign -s - --entitlements tools/sign/runnyd.entitlements --force dist/runnyd
          # The sign step exits 0 even for a plist whose key is wrong;
          # assert the entitlement actually embedded (CI security).
          codesign -d --entitlements - dist/runnyd | grep -q com.apple.security.virtualization
          tar -C dist -czf "runny_${VERSION}_darwin_arm64.tar.gz" runnyd runnyctl
          shasum -a 256 "runny_${VERSION}_darwin_arm64.tar.gz" > "runny_${VERSION}_darwin_arm64.tar.gz.sha256"
          echo "sha256=$(cut -d' ' -f1 < "runny_${VERSION}_darwin_arm64.tar.gz.sha256")" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4
        with:
          subject-path: runny_*.tar.gz
      - name: attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" runny_*.tar.gz runny_*.sha256

  homebrew:
    needs: artifacts
    runs-on: ubuntu-latest
    # contents:read is only to check out this repo's formula template; the tap
    # push uses a GitHub App installation token scoped to homebrew-tap, never
    # GITHUB_TOKEN (which has no cross-repo write anyway).
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: mint tap token
        id: tap-token
        # The release bot App; its id is a public var, its key a secret. Absent
        # until configured, which makes the whole tap update a graceful no-op.
        if: ${{ vars.RELEASER_APP_ID != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
          owner: bojanrajkovic
          repositories: homebrew-tap
      - name: update tap formula
        if: ${{ steps.tap-token.outputs.token != '' }}
        env:
          TAP_TOKEN: ${{ steps.tap-token.outputs.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.artifacts.outputs.version }}
          SHA: ${{ needs.artifacts.outputs.sha256 }}
        run: |
          export URL="https://github.com/${REPO}/releases/download/${TAG}/runny_${VERSION}_darwin_arm64.tar.gz"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/bojanrajkovic/homebrew-tap.git" tap
          mkdir -p tap/Formula
          # Render the reviewed template; only these three vars are substituted
          # so Ruby's own #{...} interpolations pass through untouched.
          envsubst '${VERSION} ${URL} ${SHA}' < tools/deploy/runny.rb.tmpl > tap/Formula/runny.rb
          cd tap
          git add Formula/runny.rb
          git -c user.name="runny-release[bot]" -c user.email="noreply@coderinserepeat.com" \
            commit -m "runny ${VERSION}"
          # Explicit target: cloning an empty tap can leave the local branch
          # named 'master', and brew reads the formula from the default branch
          # (main). HEAD:main pushes there regardless of the local name.
          git push origin HEAD:main
