# Release artifacts (ADR-0010): cold stamped Bazel build (no caches — see
# CONTRIBUTING.md "CI security"), signed and notarized in-graph by the
# runnyd_notarized target, checksummed, attested, and attached to the
# release; then the Homebrew tap formula is updated when the releaser App
# is configured. The formula's sha256 comes from the package step's own
# checksum via job outputs — never from re-downloading the asset (a
# CDN-propagation race, and it would attest whatever GitHub served rather
# than what this run built).
#
# Signing and notarization are Bazel genrule targets (tools/sign/sign.bzl):
#   codesign_binary  → //cmd/runnyd:runnyd_signed  (Developer ID + hardened runtime + timestamp)
#   notarize_binary  → //cmd/runnyd:runnyd_notarized (notarytool submit --wait; output identical to input)
#   codesign_app/notarize_app/app_dmg/notarize_dmg
#                    → //apps/Runny:Runny_notarized_dmg (signed, notarized, stapled app in a stapled dmg)
#
# When BUILD_CERTIFICATE_BASE64 is absent the build falls back to ad-hoc
# signing and skips notarization — both graceful-skip paths live in the
# Bazel targets, not in workflow conditionals.
name: release

on:
  release:
    types: [published]

# One release at a time, never cancelled mid-publish; a second publish
# event queues behind the first.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  artifacts:
    name: build + attest artifacts
    runs-on: macos-26
    # Signing/notary credentials (Developer ID, when configured) live on
    # this environment, restricted to v* tag refs; jobs outside it cannot
    # read them.
    environment: release
    permissions:
      contents: write # attach assets to the release
      id-token: write # OIDC identity for provenance attestation
      attestations: write # attest-build-provenance stores the attestation
    # The `secrets` context is NOT available in step `if:` conditions — using
    # it there is a workflow validation error that fails the file's startup on
    # every push. Map secret PRESENCE to job-level env (where secrets ARE
    # allowed) once, and gate the optional signing/notary steps on env, which
    # `if:` can read. The secret VALUES are still only read where used.
    env:
      HAS_SIGNING_CERT: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' }}
      HAS_NOTARY_KEY: ${{ secrets.NOTARY_KEY_P8 != '' }}
    outputs:
      version: ${{ steps.package.outputs.version }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # tools/version.sh needs tags
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          cache: false

      # Import the Developer ID cert into a short-lived keychain. Skipped
      # (and the keychain cleanup step no-ops) when the secret is absent.
      # The identity string is extracted from the keychain after import so
      # the workflow never hardcodes a specific cert CN.
      - name: import signing certificate
        id: import-cert
        if: ${{ env.HAS_SIGNING_CERT == 'true' }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" \
            -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          # Allow codesign to use the key without interactive prompts.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | awk -F'"' '/Developer ID Application/{print $2; exit}')
          echo "codesign_identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      # Decode notary credentials into job env vars so --config=notarize can
      # pick them up via --action_env (no value → inherit from environment).
      # Skipped when the secret is absent; the notarize_binary genrule then
      # sees an empty NOTARY_KEY_B64 and copies the binary unchanged.
      - name: set notarization credentials
        if: ${{ env.HAS_NOTARY_KEY == 'true' }}
        run: |
          echo "NOTARY_KEY_B64=$(printf '%s' "$NOTARY_KEY_P8" | base64 | tr -d '\n')" >> "$GITHUB_ENV"
          echo "NOTARY_KEY_ID=$NOTARY_KEY_ID_VAL" >> "$GITHUB_ENV"
          echo "NOTARY_ISSUER_ID=$NOTARY_ISSUER_ID_VAL" >> "$GITHUB_ENV"
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID_VAL: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID_VAL: ${{ secrets.NOTARY_ISSUER_ID }}

      - name: build (cold, stamped, signed, notarized)
        env:
          # Developer ID when the cert is present; '-' (ad-hoc) otherwise.
          # The identity is read from the keychain after import — never hardcoded.
          CODESIGN_IDENTITY: ${{ steps.import-cert.outputs.codesign_identity || '-' }}
        # --embed_label feeds apple_bundle_version so the app's
        # CFBundleShortVersionString/CFBundleVersion match the release tag.
        run: |
          VERSION="$(mise x -- tools/version.sh)"
          mise x -- bazel build --config=ci --config=release \
            --action_env="CODESIGN_IDENTITY=$CODESIGN_IDENTITY" \
            --config=notarize \
            --embed_label="$VERSION" \
            //cmd/runnyd:runnyd_notarized //cmd/runnyctl:runnyctl_notarized \
            //apps/Runny:Runny_notarized_dmg

      # Remove the temp keychain whether the build succeeded or failed.
      - name: remove signing keychain
        if: ${{ always() && steps.import-cert.outcome != 'skipped' }}
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db"

      - name: package
        id: package
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(mise x -- tools/version.sh)"
          # The tag must be exactly what version.sh stamps at this commit —
          # a hand-named tag is how svu and release-please diverge (ADR-0010).
          [ "v$VERSION" = "$TAG" ] || { echo "tag $TAG != stamped v$VERSION" >&2; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          cp bazel-bin/cmd/runnyd/runnyd_notarized.bin dist/runnyd
          cp bazel-bin/cmd/runnyctl/runnyctl_notarized.bin dist/runnyctl
          tar -C dist -czf "runny_${VERSION}_darwin_arm64.tar.gz" runnyd runnyctl
          shasum -a 256 "runny_${VERSION}_darwin_arm64.tar.gz" > "runny_${VERSION}_darwin_arm64.tar.gz.sha256"
          echo "sha256=$(cut -d' ' -f1 < "runny_${VERSION}_darwin_arm64.tar.gz.sha256")" >> "$GITHUB_OUTPUT"
          cp bazel-bin/apps/Runny/Runny_notarized_dmg.dmg "Runny_${VERSION}.dmg"
          shasum -a 256 "Runny_${VERSION}.dmg" > "Runny_${VERSION}.dmg.sha256"
      - uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4
        with:
          subject-path: |
            runny_*.tar.gz
            Runny_*.dmg
      - name: attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" runny_*.tar.gz runny_*.sha256 Runny_*.dmg Runny_*.dmg.sha256

  homebrew:
    name: update tap formula
    needs: artifacts
    runs-on: ubuntu-latest
    # The App private key is on releaser-app (see release-please.yml) —
    # this job mints App tokens but must not see signing credentials.
    environment: releaser-app
    # contents:read is only to check out this repo's formula template; the tap
    # push uses a GitHub App installation token scoped to homebrew-tap, never
    # GITHUB_TOKEN (which has no cross-repo write anyway).
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: mint tap token
        id: tap-token
        # The release bot App; its id is a public var, its key a secret. Absent
        # until configured, which makes the whole tap update a graceful no-op.
        if: ${{ vars.RELEASER_APP_ID != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
          owner: bojanrajkovic
          repositories: homebrew-tap
          # Formula push only — without this the token inherits every
          # permission the App installation has.
          permission-contents: write
      - name: update tap formula
        if: ${{ steps.tap-token.outputs.token != '' }}
        env:
          TAP_TOKEN: ${{ steps.tap-token.outputs.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.artifacts.outputs.version }}
          SHA: ${{ needs.artifacts.outputs.sha256 }}
        run: |
          export URL="https://github.com/${REPO}/releases/download/${TAG}/runny_${VERSION}_darwin_arm64.tar.gz"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/bojanrajkovic/homebrew-tap.git" tap
          mkdir -p tap/Formula
          # Render the reviewed template; only these three vars are substituted
          # so Ruby's own #{...} interpolations pass through untouched.
          envsubst '${VERSION} ${URL} ${SHA}' < tools/deploy/runny.rb.tmpl > tap/Formula/runny.rb
          cd tap
          git add Formula/runny.rb
          git -c user.name="runny-release[bot]" -c user.email="noreply@coderinserepeat.com" \
            commit -m "runny ${VERSION}"
          # Explicit target: cloning an empty tap can leave the local branch
          # named 'master', and brew reads the formula from the default branch
          # (main). HEAD:main pushes there regardless of the local name.
          git push origin HEAD:main
