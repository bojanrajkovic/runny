# Hosted Renovate cannot run bazel, so its MODULE.bazel / bazel-version PRs
# arrive with a stale MODULE.bazel.lock and fail CI's --lockfile_mode=error
# (#22; CONTRIBUTING.md "Renovate and the bzlmod lockfile"). This regenerates
# the lockfile and pushes it back to the Renovate branch.
#
# Triggered on push (not pull_request): environment protection evaluates a
# pull_request job against the merge ref (refs/pull/N/merge), which no branch
# policy can match — push runs against refs/heads/renovate/*, which the
# releaser-app policy allows. Push also regenerates before the PR even opens,
# and the bot's own lockfile push cannot re-trigger this workflow (it only
# touches MODULE.bazel.lock, which the paths filter excludes).
#
# The push uses an App token, not GITHUB_TOKEN: GitHub suppresses workflow
# triggers for GITHUB_TOKEN pushes, so CI would never run on the fixed head.
name: renovate-lockfile

on:
  push:
    branches:
      - "renovate/**"
    paths:
      - "MODULE.bazel"
      - ".mise.toml" # bazel version bumps resolve different implicit deps

# A newer push to the branch supersedes any in-flight regen.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  regen:
    name: regenerate bazel lockfile
    # No actor condition: push events only fire from same-repo branches, the
    # branch filter is renovate/**, and the environment ref policy re-checks —
    # an actor check would be re-run-spoofable anyway (zizmor bot-conditions).
    runs-on: ubuntu-latest
    # The App private key lives on releaser-app (see release-please.yml);
    # the environment's ref policy additionally restricts it to renovate/*.
    environment: releaser-app
    permissions:
      contents: read # checkout only; the push uses the App token
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          app-id: ${{ vars.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
          # Lockfile push to this repo's Renovate branch only.
          permission-contents: write
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          # No caches: the lockfile this produces feeds every later build —
          # the same cold reasoning as the artifact job (CI security).
          cache: false
      - name: regenerate lockfile
        run: mise x -- bazel mod deps --lockfile_mode=update
      - name: push lockfile if changed
        env:
          TOKEN: ${{ steps.app.outputs.token }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if git diff --quiet -- MODULE.bazel.lock; then
            echo "lockfile already current; nothing to push"
            exit 0
          fi
          # gitIgnoredAuthors in renovate.json5 must keep matching this email,
          # or Renovate treats the branch as human-edited and stops rebasing.
          git -c user.name="runny-release[bot]" -c user.email="noreply@coderinserepeat.com" \
            commit -m "chore(deps): regenerate MODULE.bazel.lock" -- MODULE.bazel.lock
          git push "https://x-access-token:${TOKEN}@github.com/${REPO}.git" "HEAD:${BRANCH}"
