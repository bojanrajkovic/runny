// The runny.v1 control contract, served by runnyd over its unix socket.
// runnyctl and RunnyBar are sibling clients of this service; anything one can
// do, the other can, by construction (ADR-0006).
syntax = "proto3";

package runny.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/bojanrajkovic/runny/proto/runny/v1;runnyv1";

service RunnyService {
  // Snapshot of every slot.
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  // Status snapshots pushed on every state transition (plus a periodic tick).
  rpc WatchStatus(WatchStatusRequest) returns (stream GetStatusResponse);
  // Follow the daemon's structured log ring buffer.
  rpc StreamLogs(StreamLogsRequest) returns (stream LogLine);
  // Inject a teardown into a slot's cycle.
  rpc Recycle(RecycleRequest) returns (RecycleResponse);
  // Hold a slot in BACKOFF(paused) after its current cycle drains.
  rpc Pause(PauseRequest) returns (PauseResponse);
  rpc Resume(ResumeRequest) returns (ResumeResponse);
  // Render a slot's most recent cycles: the timeline behind "why is it like this".
  rpc Why(WhyRequest) returns (WhyResponse);
  // Re-run startup validation on demand.
  rpc Doctor(DoctorRequest) returns (DoctorResponse);
  // Validate the on-disk config with the same checks a cold start applies,
  // then drain every slot to stable idle (running jobs finish first) and
  // exit for a launchd respawn on the new config. Refused — with the
  // failing checks and the running daemon untouched — when the new config
  // would not survive startup validation. Runs (and reports) validation
  // even while a drain is already in progress: the imminent respawn loads
  // the on-disk file regardless, so the verdict matters most then.
  rpc Reload(ReloadRequest) returns (ReloadResponse);
  // Inject an operator public key into a slot's live guest. In LISTENING:
  // freeze the slot in DEBUG (runner verifiably killed, no jobs, no
  // max-idle). In JOB: install the key immediately (the job is untouched)
  // and arm a DEBUG hold for job end. In DEBUG: extend the hold / add a
  // key. Per-guest, per-cycle: the key dies at teardown.
  rpc InjectDebugKey(InjectDebugKeyRequest) returns (InjectDebugKeyResponse);
}

// SlotState mirrors internal/statemachine; the FSM is the authority (ADR-0004).
enum SlotState {
  SLOT_STATE_UNSPECIFIED = 0;
  SLOT_STATE_BACKOFF = 1;
  SLOT_STATE_ENSURE_IMAGE = 2;
  SLOT_STATE_CLONE = 3;
  SLOT_STATE_BOOT = 4;
  SLOT_STATE_AWAIT_IP = 5;
  SLOT_STATE_AWAIT_SSH = 6;
  SLOT_STATE_MINT_JIT = 7;
  SLOT_STATE_PROVISION = 8;
  SLOT_STATE_LISTENING = 9;
  SLOT_STATE_JOB = 10;
  SLOT_STATE_TEARDOWN = 11;
  // Appended (wire compat); sits between AWAIT_SSH and MINT_JIT in cycle
  // order. Numeric order already diverges from cycle order — render by name.
  SLOT_STATE_SECURE_SSH = 12;
  // Appended (wire compat); render by name (same caveat as SECURE_SSH): a
  // guest held for operator debugging (runner killed and proven dead,
  // max-idle suspended).
  SLOT_STATE_DEBUG = 13;
}

message VMInfo {
  string mac = 1;
  string ip = 2;
}

message JobInfo {
  string name = 1;
  google.protobuf.Timestamp started = 2;
  // SHA256:… fingerprints of operator debug keys present in (or ambiguously
  // attempted against) the guest WHILE this job ran. Non-empty means the
  // job executed with an operator credential in its trust environment;
  // details and outcomes in CycleRecord.injected_keys.
  repeated string operator_keys = 3;
}

message SlotStatus {
  string slot = 1;
  SlotState state = 2;
  google.protobuf.Timestamp state_entered = 3;
  string cycle_id = 4;
  bool paused = 5;
  // Consecutive failed cycles; current backoff if state == BACKOFF.
  uint32 consecutive_failures = 6;
  int64 backoff_seconds = 7;
  VMInfo vm = 8;
  JobInfo job = 9;
  // Summary of the last failure, empty after a successful cycle.
  string last_failure = 10;
  // Free-form live annotation for the current state (e.g. pull progress
  // "2.1 GiB at 41 MiB/s" during ENSURE_IMAGE). Empty when the state has
  // nothing to report.
  string detail = 11;
  // The guest survived force-stop and still occupies a host guest-cap slot;
  // the slot is parked and the daemon restarts cold once no job is running.
  bool wedged = 12;
  // The GitHub-visible runner name of the current cycle
  // (<instance-prefix>-<slot>-<cycle8>); empty in BACKOFF.
  string runner_name = 13;
  // The pool's configured image ref, verbatim from config.yaml `image`
  // (may be a moving tag or a digest pin). Constant for the slot's
  // lifetime. Set by any daemon that supports this field; a client talking
  // to an older daemon may see it empty and must tolerate that.
  string image = 14;
  // Resolved manifest digest ("sha256:...") for the current cycle; set as
  // soon as the registry round-trip resolves the digest — before the pull
  // starts. Empty before that and in BACKOFF. Presence means "digest
  // resolved this cycle", not "a guest booted" or "pull complete": a slot
  // mid-pull or failing in CLONE or BOOT still carries it; the guest, once
  // booted, runs exactly this digest. A wedged slot retains it — the
  // surviving guest is still running that image. Clients must not
  // synthesize this from a configured digest pin: empty means the registry
  // round-trip has not completed this cycle. Historical cycles carry theirs
  // in CycleRecord.image_digest.
  string image_digest = 15;
  // Non-zero iff state == DEBUG (cleared the instant DEBUG is left): when
  // the hold auto-recycles.
  google.protobuf.Timestamp debug_hold_expires = 16;
  // True iff state == JOB with a debug hold CURRENTLY armed: the slot will
  // enter DEBUG (not teardown) when the job ends. Cleared the instant the
  // hold is disarmed (plain recycle, pause) or DEBUG/TEARDOWN is entered.
  bool debug_hold_armed = 17;
  // Asset filename of the actions-runner tarball ensured this cycle
  // (e.g. "actions-runner-osx-arm64-2.320.0.tar.gz"); set when ENSURE_IMAGE
  // completes, empty before that and in BACKOFF. Empty from older daemons.
  string runner_version = 18;
  // Completed states from the current in-flight cycle, in entry order.
  // Populated when each state finishes; empty in BACKOFF and from older
  // daemons. The current state is state+state_entered (not included here):
  // clients render it as a live clock. Left is always set; outcome is "ok",
  // "error", or "deadline".
  repeated StateRecord active_cycle_states = 19;
  // A bounded, recent-first-evicted history of the command_ids the daemon has
  // actually APPLIED for this slot (PauseRequest.command_id /
  // ResumeRequest.command_id). The client confirms a pending pause/resume by
  // membership: its id is present iff that specific command applied. A history
  // rather than a scalar so concurrent clients (and a fast second command on
  // the same slot) don't clobber each other's acknowledgement — last-writer
  // on a single field would lose every id but the most recent. Only IDENTIFIED
  // commands are recorded: a daemon-internal re-issue (empty id) appends
  // nothing. Empty from a daemon that has applied no identified command yet,
  // and from daemons predating protocol_version >= 1.
  repeated string recent_applied_command_ids = 20;
}

message GetStatusRequest {}

// LocalNetworkGrant classifies the daemon's macOS Local Network (TCC) access —
// the permission a per-user LaunchAgent needs to reach guests on the vmnet
// subnet (a LaunchDaemon or background-reparented daemon is silently denied;
// docs/deploy.md). The daemon cannot query its own TCC grant directly (no public
// API); it infers from whether the guest subnet is reachable, which is
// undetermined until a vmnet interface exists (first guest boot). The signal is
// LIVE, never remembered: a cached "granted" would outlive a revoked grant — a
// false negative that hides a real failure, which this project refuses.
//
// NOT gated on protocol_version, and a bump is unnecessary: this field is present
// from the FIRST release onward, so no deployed daemon can predate it. The
// "same-core daemon at protocol N that lacks this field" upgrade window the
// protocol axis guards therefore cannot arise for it — there is no prior release
// to be behind. (A future field that real, shipped releases could straddle would
// still bump; this one straddles nothing.) The UNSPECIFIED zero additionally
// covers a non-darwin or not-yet-sampled daemon, distinct from the ambiguous
// boot_id/exit_held zeros (""/false) that DID need the >= 2 gate.
enum LocalNetworkGrant {
  // The daemon does not publish this signal (predates the field) or has not yet
  // sampled, and on non-darwin builds. Clients show no grant affordance and rely
  // on the version-skew banner to surface a stale daemon.
  LOCAL_NETWORK_GRANT_UNSPECIFIED = 0;
  // No vmnet interface is up yet (no guest has booted this run), so reachability
  // is undetermined. Clients treat this as "the Local Network prompt may be
  // pending" and surface the grant affordance proactively — before the first
  // guest dial can fail as "no route to host".
  LOCAL_NETWORK_GRANT_UNKNOWN = 1;
  // A vmnet interface is up and the guest subnet is reachable: the grant is
  // present. No affordance.
  LOCAL_NETWORK_GRANT_REACHABLE = 2;
  // A vmnet interface is up but the guest subnet is unreachable from this
  // process — the TCC-denial signature (the host shell reaches it; this daemon
  // does not). Clients surface the grant affordance.
  LOCAL_NETWORK_GRANT_DENIED = 3;
}

message GetStatusResponse {
  repeated SlotStatus slots = 1;
  google.protobuf.Timestamp daemon_started = 2;
  string version = 3;
  // Non-empty while the daemon is draining toward a restart (wedged guest,
  // ADR-0012, or config reload): the reason every slot is pausing/recycling.
  // Slots converge to paused BACKOFF (or wedged), then the daemon exits and
  // launchd cold-starts it. Clients derive the still-draining slots from
  // `slots` (any slot not wedged and not paused-in-BACKOFF). May carry a
  // hold annotation when the exit gate is refusing to exit onto a config
  // that no longer parses.
  string draining = 4;
  // The daemon's worst-case synchronous wait for an InjectDebugKey call,
  // derived from config (reconcile_interval + secure_ssh). A client issuing
  // `debug` must set its own deadline to at least this — otherwise on a host
  // with raised deadlines the daemon outlives the client, and the operator is
  // told "nothing was injected" while the key is actually installed. Zero from
  // a daemon that predates this field; clients fall back to a built-in default.
  google.protobuf.Duration inject_handler_wait = 5;
  // Monotonic wire-contract version, bumped when the daemon gains a feature a
  // client must detect before relying on it. 0 from any daemon predating this
  // field. Pause/resume command acknowledgement (recent_applied_command_ids)
  // requires >= 1: a client confirms pause/resume from the command id only
  // when the daemon advertises >= 1, and otherwise treats the command as
  // applied-but-unconfirmable rather than confirming from slot state.
  // Reload-convergence confirmation (boot_id, config_sha256, drain_seq,
  // exit_held below) requires >= 2: against an older daemon a reload-following
  // client falls back to daemon_started as the respawn discriminator and warns
  // that it cannot positively confirm the config.
  uint32 protocol_version = 6;
  // SHA-256 (hex) of the raw config bytes THIS running process loaded at its
  // cold start. A reload-following client compares it against the hash the
  // Reload RPC returned (ReloadResponse.config_sha256) to prove the respawn
  // came up on the file the preflight vetted, not a stale or re-edited one.
  // Empty from a daemon advertising protocol_version < 2.
  string config_sha256 = 7;
  // A random per-process identity minted fresh at every cold start (never
  // persisted, never read from disk). It is the respawn discriminator: a
  // client that captured a daemon's boot_id and later sees a DIFFERENT one
  // knows a genuinely new process answered — launchd restarts on any exit, so
  // reachability alone cannot prove a respawn. Distinct from the persisted
  // instance-id, which names the host's runner family and is STABLE across
  // respawns (it cannot discriminate). Empty from protocol_version < 2.
  string boot_id = 8;
  // A monotone counter the daemon bumps on each real drain-progress event (a
  // slot transitioning while draining, or the exit-gate hold being set or
  // cleared) — NOT on the periodic status heartbeat. A reload-following client
  // resets its progress-stall timer only when this CHANGES, so a wedged daemon
  // that still answers the 30s heartbeat (frozen drain_seq) no longer masks a
  // stalled drain. 0 and constant from a non-draining or protocol_version < 2
  // daemon. The client watches for change, not an absolute value, so a
  // double-count or flap is harmless.
  uint64 drain_seq = 9;
  // True while the drain has converged but the exit gate is REFUSING to exit
  // onto a config that no longer parses (the human-readable detail is appended
  // to `draining`). The held state is operator-actionable and indefinite by
  // design — fixing the file releases it — so a reload-following client must
  // suppress its progress-stall while this is set rather than report a false
  // "the daemon may be hung". An authoritative flag, not derivable from the
  // `draining` string (clients must never re-parse the reason). False from
  // protocol_version < 2.
  bool exit_held = 10;
  // The daemon's live Local Network (TCC) grant classification (see
  // LocalNetworkGrant). Sampled off the status hot path and cached, so it is at
  // most one sampling interval stale. UNSPECIFIED from a daemon that predates
  // this field, has not sampled yet, or runs on a non-darwin build — clients
  // show no grant affordance for UNSPECIFIED.
  LocalNetworkGrant local_network_grant = 11;
}

message WatchStatusRequest {}

message StreamLogsRequest {
  // Number of buffered lines to replay before following; 0 = follow only.
  uint32 replay = 1;
  // When false, send the replay snapshot and close instead of following.
  bool follow = 2;
  // The default stream is runner output (each guest's run.sh lines, tagged
  // with slot/cycle attrs); daemon switches to runnyd's own structured log.
  bool daemon = 3;
  // slot filters runner output to one slot; empty = all slots interleaved.
  // Invalid with daemon.
  string slot = 4;
}

message LogLine {
  google.protobuf.Timestamp time = 1;
  string level = 2;
  string message = 3;
  map<string, string> attrs = 4;
}

message RecycleRequest {
  string slot = 1;
  string reason = 2;
  // Consent to cancel a RUNNING job: if the slot is in JOB, recycle cancels
  // the job into teardown only when this is set (runnyctl sets it via its
  // -force guard after observing JOB). Unset, a mid-job recycle disarms any
  // debug hold and the job runs to its normal end. Ignored outside JOB.
  bool cancel_running_job = 3;
}

message RecycleResponse {}

message PauseRequest {
  string slot = 1;
  // Opaque, client-generated correlation id (a random UUID). The daemon
  // appends it to SlotStatus.recent_applied_command_ids once this command is
  // applied, letting the client confirm THIS pause rather than inferring
  // confirmation from the slot happening to be paused. Empty from older
  // clients and from daemon-internal re-issues; the daemon never records
  // empty.
  string command_id = 2;
}

message PauseResponse {
  // Non-empty while the daemon is draining toward a restart: warns that
  // pause is in-memory and will not survive the imminent respawn. Old
  // clients ignore it (wire-compatible).
  string note = 1;
}

message ResumeRequest {
  string slot = 1;
  // See PauseRequest.command_id: opaque client-generated correlation id,
  // appended to SlotStatus.recent_applied_command_ids when this resume applies.
  string command_id = 2;
}

message ResumeResponse {}

message WhyRequest {
  string slot = 1;
  // How many recent cycles to return; 0 = just the most recent.
  uint32 cycles = 2;
}

// CycleRecord mirrors the on-disk cycle.json artifact.
message CycleRecord {
  string cycle_id = 1;
  string slot = 2;
  string image_digest = 3;
  google.protobuf.Timestamp started = 4;
  google.protobuf.Timestamp finished = 5;
  // "success" or "failure".
  string result = 6;
  repeated StateRecord states = 7;
  VMInfo vm = 8;
  JobInfo job = 9;
  string failure_state = 10;
  string failure_error = 11;
  // Paths of retained post-mortem artifacts (failure cycles).
  repeated string artifacts = 12;
  // The pool's configured image ref at cycle time (config.yaml `image`,
  // verbatim; may be a moving tag). Records intent even for cycles that
  // failed before a digest resolved. Empty in records written by older
  // daemons.
  string image = 13;
  // Operator debug-key activity against this cycle's guest (audit trail;
  // every attempt, including failed and refused ones).
  repeated InjectedKey injected_keys = 14;
  // Asset filename of the actions-runner tarball ensured this cycle
  // (e.g. "actions-runner-osx-arm64-2.320.0.tar.gz"); empty when the runner
  // tarball step was skipped or the cycle failed before ENSURE_IMAGE completed.
  // Empty in records written by older daemons.
  string runner_version = 15;
  // Absolute path of this cycle's artifact directory on the daemon host —
  // the directory that holds cycle.json and any retained post-mortem files.
  // Set by daemons that support this field; older daemons leave it empty and
  // clients must fall back to reconstructing the path from cycle metadata.
  // Clients MUST NOT synthesize this from started+cycle_id: crash-orphan
  // records have a Started that does not match the directory name.
  string cycle_dir = 16;
}

message InjectedKey {
  string fingerprint = 1;                   // SHA256:…
  string comment = 2;                       // from the submitted key; audit-only
  google.protobuf.Timestamp injected = 3;
  string reason = 4;
  // "pending" | "ok" | "armed" | "re-armed" | "refused" | "unreachable" |
  // "error" | "disarmed"
  string outcome = 5;
  string error = 6;
  // FSM state at the attempt: "LISTENING" | "JOB" | "DEBUG". "JOB" entries
  // are mid-job contamination events (outcome "armed" = the key landed
  // while the job ran).
  string state = 7;
}

message StateRecord {
  SlotState state = 1;
  google.protobuf.Timestamp entered = 2;
  google.protobuf.Timestamp left = 3;
  // "ok", "error", or "deadline".
  string outcome = 4;
  string error = 5;
}

message WhyResponse {
  repeated CycleRecord cycles = 1;
}

message DoctorRequest {}

message DoctorCheck {
  string name = 1;
  bool ok = 2;
  string detail = 3;
}

message DoctorResponse {
  repeated DoctorCheck checks = 1;
}

message ReloadRequest {
  // Recorded in the daemon log and as each slot's recycle reason.
  string reason = 1;
}

message ReloadResponse {
  // True when the on-disk config passed validation and the daemon is
  // draining toward a respawn that will load it (whether this call started
  // the drain or one was already running). False = refused; see
  // failed_checks. When false AND draining is non-empty, the daemon is
  // already draining and the respawn WILL load the invalid file — fix it
  // before the drain converges.
  bool accepted = 1;
  // The checks that failed against the new config (config-parse,
  // github-client:<pool>, and the doctor suite). Empty when accepted.
  repeated DoctorCheck failed_checks = 2;
  // Environment-sensitive results that do not block the reload (e.g.
  // local-network, which cannot fail a cold start and no config edit can
  // affect). Render, don't gate on.
  repeated DoctorCheck warnings = 3;
  // The active drain reason after this call: this reload's, or the
  // pre-existing drain's (wedge / earlier reload) when one was running.
  string draining = 4;
  // Slots being drained (accepted only).
  int32 slot_count = 5;
  // Slots that were operator-paused at acceptance; their pause is
  // in-memory and clears at the respawn.
  repeated string operator_paused_slots = 6;
  // SHA-256 (hex) of the raw config file bytes the preflight validated;
  // the same hash is logged at acceptance and by the respawn's cold start,
  // making "which file version was vetted" provable.
  string config_sha256 = 7;
  // True iff THIS call started the drain (accepted only). False means a
  // drain was already running (wedge or earlier reload) and the respawn will
  // apply this validated config. The daemon knows this authoritatively
  // (drainer.Start's return) — clients render it, never re-derive it by
  // string-matching the drain reason.
  bool started_drain = 8;
  // The boot_id of the daemon process that ACCEPTED this reload, stamped by
  // the same handler that returns config_sha256 — captured in this one
  // round-trip with no prior status read. A reload-following client uses it as
  // the baseline and waits for a status reporting a DIFFERENT boot_id; because
  // it is the accepting process's own identity, there is no earlier read whose
  // process could differ, so the respawn is identified positively with no
  // window to misattribute. Empty from a daemon advertising
  // protocol_version < 2 (the client then falls back to daemon_started).
  string accepting_boot_id = 9;
}

message InjectDebugKeyRequest {
  string slot = 1;                    // slot or runner name (findSlot rules)
  string public_key = 2;              // one authorized_keys line (a .pub file's contents)
  google.protobuf.Duration hold = 3;  // 0 = limits.max_debug_hold; negative or
                                      // greater than the cap is REJECTED, not clamped
  string reason = 4;                  // audit note
}

message InjectDebugKeyResponse {
  string user = 1;                            // guest ssh user (pool config)
  string ip = 2;                              // guest ip
  string fingerprint = 3;                     // SHA256:… of the installed key
  // Auto-release deadline. UNSET when armed=true: the hold clock starts at
  // DEBUG entry (job end), unknowable here; the definitive deadline appears
  // in SlotStatus.debug_hold_expires then.
  google.protobuf.Timestamp hold_until = 4;
  // Pinned guest host keys in known_hosts-able form (ADR-0013); empty when
  // unpinned (ssh_hardening: off).
  repeated string host_keys = 5;
  // True when the key was installed into a RUNNING job and a post-job DEBUG
  // hold was armed. The key is usable NOW.
  bool armed = 6;
}
